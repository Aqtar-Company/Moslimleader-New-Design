<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>qbsml.json — glyph set viewer</title>
<style>
@font-face {
  font-family: "QBSML";
  src: url("fonts-woff2/QCF4_QBSML.woff2") format("woff2");
}

/**
 * Coldark Theme for Prism.js
 * Theme variation: Dark
 * Tested with HTML, CSS, JS, JSON, PHP, YAML, Bash script
 * @author Armand Philippot <contact@armandphilippot.com>
 * @homepage https://github.com/ArmandPhilippot/coldark-prism
 * @license MIT
 */
code[class*="language-"],
pre[class*="language-"] {
	color: #e3eaf2;
	background: none;
	font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
	text-align: left;
	white-space: pre;
	word-spacing: normal;
	word-break: normal;
	word-wrap: normal;
	line-height: 1.5;
	-moz-tab-size: 4;
	-o-tab-size: 4;
	tab-size: 4;
	-webkit-hyphens: none;
	-moz-hyphens: none;
	-ms-hyphens: none;
	hyphens: none;
}

pre[class*="language-"]::-moz-selection,
pre[class*="language-"] ::-moz-selection,
code[class*="language-"]::-moz-selection,
code[class*="language-"] ::-moz-selection {
	background: #3c526d;
}

pre[class*="language-"]::selection,
pre[class*="language-"] ::selection,
code[class*="language-"]::selection,
code[class*="language-"] ::selection {
	background: #3c526d;
}

/* Code blocks */
pre[class*="language-"] {
	padding: 1em;
	margin: 0.5em 0;
	overflow: auto;
}

:not(pre) > code[class*="language-"],
pre[class*="language-"] {
	background: #111b27;
}

/* Inline code */
:not(pre) > code[class*="language-"] {
	padding: 0.1em 0.3em;
	border-radius: 0.3em;
	white-space: normal;
}

.token.comment,
.token.prolog,
.token.doctype,
.token.cdata {
	color: #8da1b9;
}

.token.punctuation {
	color: #e3eaf2;
}

.token.delimiter.important,
.token.selector .parent,
.token.tag,
.token.tag .token.punctuation {
	color: #66cccc;
}

.token.attr-name,
.token.boolean,
.token.boolean.important,
.token.number,
.token.constant,
.token.selector .token.attribute {
	color: #e6d37a;
}

.token.class-name,
.token.key,
.token.parameter,
.token.property,
.token.property-access,
.token.variable {
	color: #6cb8e6;
}

.token.attr-value,
.token.inserted,
.token.color,
.token.selector .token.value,
.token.string,
.token.string .token.url-link {
	color: #91d076;
}

.token.builtin,
.token.keyword-array,
.token.package,
.token.regex {
	color: #f4adf4;
}

.token.function,
.token.selector .token.class,
.token.selector .token.id {
	color: #c699e3;
}

.token.atrule .token.rule,
.token.combinator,
.token.keyword,
.token.operator,
.token.pseudo-class,
.token.pseudo-element,
.token.selector,
.token.unit {
	color: #e9ae7e;
}

.token.deleted,
.token.important {
	color: #cd6660;
}

.token.keyword-this,
.token.this {
	color: #6cb8e6;
}

.token.important,
.token.keyword-this,
.token.this,
.token.bold {
	font-weight: bold;
}

.token.delimiter.important {
	font-weight: inherit;
}

.token.italic {
	font-style: italic;
}

.token.entity {
	cursor: help;
}

.language-markdown .token.title,
.language-markdown .token.title .token.punctuation {
	color: #6cb8e6;
	font-weight: bold;
}

.language-markdown .token.blockquote.punctuation {
	color: #f4adf4;
}

.language-markdown .token.code {
	color: #66cccc;
}

.language-markdown .token.hr.punctuation {
	color: #6cb8e6;
}

.language-markdown .token.url .token.content {
	color: #91d076;
}

.language-markdown .token.url-link {
	color: #e6d37a;
}

.language-markdown .token.list.punctuation {
	color: #f4adf4;
}

.language-markdown .token.table-header {
	color: #e3eaf2;
}

.language-json .token.operator {
	color: #e3eaf2;
}

.language-scss .token.variable {
	color: #66cccc;
}

/* overrides color-values for the Show Invisibles plugin
 * https://prismjs.com/plugins/show-invisibles/
 */
.token.token.tab:not(:empty):before,
.token.token.cr:before,
.token.token.lf:before,
.token.token.space:before {
	color: #8da1b9;
}

/* overrides color-values for the Toolbar plugin
 * https://prismjs.com/plugins/toolbar/
 */
div.code-toolbar > .toolbar.toolbar > .toolbar-item > a,
div.code-toolbar > .toolbar.toolbar > .toolbar-item > button {
	color: #111b27;
	background: #6cb8e6;
}

div.code-toolbar > .toolbar.toolbar > .toolbar-item > a:hover,
div.code-toolbar > .toolbar.toolbar > .toolbar-item > a:focus,
div.code-toolbar > .toolbar.toolbar > .toolbar-item > button:hover,
div.code-toolbar > .toolbar.toolbar > .toolbar-item > button:focus {
	color: #111b27;
	background: #6cb8e6da;
	text-decoration: none;
}

div.code-toolbar > .toolbar.toolbar > .toolbar-item > span,
div.code-toolbar > .toolbar.toolbar > .toolbar-item > span:hover,
div.code-toolbar > .toolbar.toolbar > .toolbar-item > span:focus {
	color: #111b27;
	background: #8da1b9;
}

/* overrides color-values for the Line Highlight plugin
 * http://prismjs.com/plugins/line-highlight/
 */
.line-highlight.line-highlight {
	background: #3c526d5f;
	background: linear-gradient(to right, #3c526d5f 70%, #3c526d55);
}

.line-highlight.line-highlight:before,
.line-highlight.line-highlight[data-end]:after {
	background-color: #8da1b9;
	color: #111b27;
	box-shadow: 0 1px #3c526d;
}

pre[id].linkable-line-numbers.linkable-line-numbers span.line-numbers-rows > span:hover:before {
	background-color: #8da1b918;
}

/* overrides color-values for the Line Numbers plugin
 * http://prismjs.com/plugins/line-numbers/
 */
.line-numbers.line-numbers .line-numbers-rows {
	border-right: 1px solid #0b121b;
	background: #0b121b7a;
}

.line-numbers .line-numbers-rows > span:before {
	color: #8da1b9da;
}

/* overrides color-values for the Match Braces plugin
 * https://prismjs.com/plugins/match-braces/
 */
.rainbow-braces .token.token.punctuation.brace-level-1,
.rainbow-braces .token.token.punctuation.brace-level-5,
.rainbow-braces .token.token.punctuation.brace-level-9 {
	color: #e6d37a;
}

.rainbow-braces .token.token.punctuation.brace-level-2,
.rainbow-braces .token.token.punctuation.brace-level-6,
.rainbow-braces .token.token.punctuation.brace-level-10 {
	color: #f4adf4;
}

.rainbow-braces .token.token.punctuation.brace-level-3,
.rainbow-braces .token.token.punctuation.brace-level-7,
.rainbow-braces .token.token.punctuation.brace-level-11 {
	color: #6cb8e6;
}

.rainbow-braces .token.token.punctuation.brace-level-4,
.rainbow-braces .token.token.punctuation.brace-level-8,
.rainbow-braces .token.token.punctuation.brace-level-12 {
	color: #c699e3;
}

/* overrides color-values for the Diff Highlight plugin
 * https://prismjs.com/plugins/diff-highlight/
 */
pre.diff-highlight > code .token.token.deleted:not(.prefix),
pre > code.diff-highlight .token.token.deleted:not(.prefix) {
	background-color: #cd66601f;
}

pre.diff-highlight > code .token.token.inserted:not(.prefix),
pre > code.diff-highlight .token.token.inserted:not(.prefix) {
	background-color: #91d0761f;
}

/* overrides color-values for the Command Line plugin
 * https://prismjs.com/plugins/command-line/
 */
.command-line .command-line-prompt {
	border-right: 1px solid #0b121b;
}

.command-line .command-line-prompt > span:before {
	color: #8da1b9da;
}


:root {
  --bg-app:     #0b121b;
  --bg-panel:   #111b27;
  --bg-tab:     #16212f;
  --bg-row-alt: #0e1720;
  --border:     #1e2c3d;
  --fg:         #e3eaf2;
  --fg-dim:     #8da1b9;
  --accent:     #6cb8e6;
  --accent-2:   #91d076;
  --num:        #e6d37a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg-app);
  color: var(--fg);
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
.page-header {
  padding: 22px 24px 14px;
}
.page-header h1 {
  margin: 0 0 6px;
  font-size: 18px;
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  font-weight: 600;
  color: var(--fg);
}
.page-header .meta {
  font-size: 12.5px;
  color: var(--fg-dim);
  line-height: 1.6;
  max-width: 900px;
}
.page-header .meta b { color: var(--accent); font-weight: 600; }

.boxes {
  display: flex;
  flex-direction: row-reverse;
  flex-wrap: wrap;
  gap: 22px;
  padding: 0 24px 40px;
}

/* ---------------- one faux editor window per set ---------------- */
.box {
  flex: 0 0 calc(50% - 11px);
  width: calc(50% - 11px);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 14px 30px -18px rgba(0,0,0,.7);
}
.box.box-full {
  flex: 0 0 100%;
  width: 100%;
}
.box .titlebar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg-tab);
  border-bottom: 1px solid var(--border);
}
.box .dots { display: flex; gap: 6px; flex: none; }
.box .dot { width: 11px; height: 11px; border-radius: 50%; }
.dot.red { background: #e0605a; }
.dot.yellow { background: #e6c15c; }
.dot.green { background: #61c46a; }
.box .filename {
  font-size: 12.5px; color: var(--fg);
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  margin-left: 4px;
}
.box .badge {
  font-size: 10.5px;
  color: var(--bg-app);
  background: var(--accent-2);
  border-radius: 999px;
  padding: 1px 8px;
  font-weight: 700;
  margin-left: 6px;
}
.box .desc {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--fg-dim);
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.box .body {
  background: var(--bg-panel);
}

table.glyph-table {
  width: 100%;
  border-collapse: collapse;
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  font-size: 12.5px;
}
table.glyph-table thead th {
  background: var(--bg-tab);
  color: var(--fg-dim);
  text-align: left;
  font-weight: 600;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.glyph-table tbody td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  vertical-align: middle;
}
table.glyph-table tbody tr:nth-child(even) { background: var(--bg-row-alt); }
table.glyph-table tbody tr:hover { background: #16212f; }

td.c-idx  { color: var(--fg-dim); text-align: right; }
td.c-num  { color: var(--num); }
td.c-en   { color: var(--accent); }
td.c-ar   { color: var(--accent-2); direction: rtl; text-align: right; font-family: "QBSML", "Amiri Quran", serif; font-size: 15px; }
td.c-hex  { color: #f4adf4; }
td.c-tr   { color: #c699e3; }
td.c-glyph {
  direction: rtl;
  text-align: center;
  width: 1%;
}
.glyph {
  display: inline-block;
  height: 34px;
  overflow: hidden;
  font-family: "QBSML", serif;
  font-size: 24px;
  color: #e6d37a;
  line-height: 34px;
}

.loading, .error {
  padding: 40px; text-align: center; color: var(--fg-dim);
  font-family: Consolas, Monaco, monospace;
}
.error { color: #e0605a; }
</style>
</head>
<body>

<div class="page-header">
  <h1>quran-qcf4dataset / qbsml.json</h1>
  <div class="meta" id="meta">Loading qbsml.json…</div>
</div>

<div class="boxes" id="boxes"></div>

<script>
const COLUMN_CONFIGS = {
  surah_headers_style_a:        surahColumns,
  surah_headers_style_b:        surahColumns,
  surah_headers_style_a_merged: mergedColumns,
  surah_headers_style_b_merged: mergedColumns,
  juz_headers_style_a:          juzColumns,
  juz_headers_style_b:          juzColumns,
  opening_matter_and_ornaments: miscColumns,
};

function surahColumns() {
  return [
    { label: "#",              cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Sura",           cell: (e) => `<td class="c-num">${e.sura}</td>` },
    { label: "Name (EN)",      cell: (e) => `<td class="c-en">${e.name_en}</td>` },
    { label: "Name (Arabic)",  cell: (e) => `<td class="c-ar">${e.name_arabic}</td>` },
    { label: "Char",           cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",          cell: (e) => glyphCell(e) },
  ];
}

function mergedColumns() {
  return [
    { label: "#",              cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Suras",          cell: (e) => `<td class="c-num">${e.suras.join(", ")}</td>` },
    { label: "Names (EN)",     cell: (e) => `<td class="c-en">${e.names_en.map(n => `<span style="display:block">${n}</span>`).join("")}</td>` },
    { label: "Names (Arabic)", cell: (e) => `<td class="c-ar">${e.names_arabic.join(" \u00b7 ")}</td>` },
    { label: "Char",           cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",          cell: (e) => glyphCell(e) },
  ];
}

function juzColumns() {
  return [
    { label: "#",              cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Juz",            cell: (e) => `<td class="c-num">${e.juz}</td>` },
    { label: "Label",          cell: (e) => `<td class="c-en">Juz ${e.juz}</td>` },
    { label: "Name (Arabic)",  cell: (e) => `<td class="c-ar">${e.name_arabic_approx}</td>` },
    { label: "Char",           cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",          cell: (e) => glyphCell(e) },
  ];
}

function miscColumns() {
  return [
    { label: "#",               cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Group",           cell: (e) => `<td class="c-en">${e.group}</td>` },
    { label: "Transliteration", cell: (e) => `<td class="c-tr">${e.kind === "text" ? e.transliteration : "\u2014"}</td>` },
    { label: "Text (Arabic)",   cell: (e) => `<td class="c-ar">${e.kind === "text" ? e.text_arabic : "\u2014"}</td>` },
    { label: "Char",            cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",           cell: (e) => glyphCell(e) },
  ];
}

function glyphCell(e) {
  const ch = String.fromCodePoint(e.codepoint);
  return `<td class="c-glyph"><span class="glyph">${ch}</span></td>`;
}

async function init() {
  const metaEl = document.getElementById('meta');
  const boxesEl = document.getElementById('boxes');

  let data;
  try {
    const res = await fetch('qbsml.json');
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    metaEl.textContent = '';
    boxesEl.innerHTML = '<div class="error">Could not load qbsml.json \u2014 serve this folder over HTTP '
      + '(e.g. python3 -m http.server) rather than opening the file directly.</div>';
    return;
  }

  metaEl.innerHTML =
    '<b>font</b> ' + data.font +
    ' &nbsp;\u00b7&nbsp; <b>total glyphs in font</b> ' + data.total_glyphs_in_font +
    ' &nbsp;\u00b7&nbsp; <b>non-empty glyphs investigated</b> ' + data.non_empty_glyphs_investigated +
    ' &nbsp;\u00b7&nbsp; <b>sets</b> ' + data.sets.length +
    '<br>' + data.description;

  const DISPLAY_ORDER = [
    "surah_headers_style_a",
    "surah_headers_style_b",
    "surah_headers_style_a_merged",
    "surah_headers_style_b_merged",
    "juz_headers_style_a",
    "juz_headers_style_b",
    "opening_matter_and_ornaments",
  ];
  const orderedSets = [...data.sets].sort(
    (a, b) => DISPLAY_ORDER.indexOf(a.name) - DISPLAY_ORDER.indexOf(b.name)
  );

  orderedSets.forEach((set) => {
    const box = document.createElement('div');
    box.className = 'box' + (set.name === 'opening_matter_and_ornaments' ? ' box-full' : '');

    const columns = (COLUMN_CONFIGS[set.name] || surahColumns)();

    const thead = columns.map(c => `<th>${c.label}</th>`).join('');
    const tbody = set.entries.map((e, i) =>
      `<tr>${columns.map(c => c.cell(e, i)).join('')}</tr>`
    ).join('');

    box.innerHTML =
      '<div class="titlebar">' +
        '<div class="dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>' +
        '<span class="filename">' + set.name + '.json</span>' +
        '<span class="badge">' + set.count + '</span>' +
        '<span class="desc">' + set.label + ' \u00b7 ' + set.codepoint_range + '</span>' +
      '</div>' +
      '<div class="body">' +
        '<table class="glyph-table">' +
          '<thead><tr>' + thead + '</tr></thead>' +
          '<tbody>' + tbody + '</tbody>' +
        '</table>' +
      '</div>';

    boxesEl.appendChild(box);
  });
}
init();
</script>
</body>
</html>
