<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>مَدَد</title>
<!-- Everything is inline: this page is opened on a network with no internet. -->
<style>
:root {
  --bg: #f6f7f4; --panel: #ffffff; --ink: #1c2421; --muted: #5d6b66; --line: #dfe5e1;
  --brand: #0f766e; --brand-ink: #ffffff; --soft: #e6f2ef; --me: #0f766e; --me-ink: #ffffff;
  --warn: #9a5b00; --warn-bg: #fff4de; --err: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111615; --panel: #182020; --ink: #e7eeeb; --muted: #9aaba5; --line: #2a3533;
    --brand: #2bb3a3; --brand-ink: #062522; --soft: #1d2d2b; --me: #1f5f58; --me-ink: #eaf7f4;
    --warn: #f0b451; --warn-bg: #2d2413; --err: #ff8a7a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.75 "Noto Naskh Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, "Geeza Pro", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.logo { font-size: 24px; font-weight: 700; color: var(--brand); }
.tag { color: var(--muted); font-size: 13px; }
.status { margin-inline-start: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: #22a06b; } .dot.bad { background: var(--err); }
.controls { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
select, textarea, button { font: inherit; color: inherit; }
select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0; flex: 1 1 140px;
}
.modes { display: flex; gap: 6px; flex: 1 1 100%; }
.mode {
  flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 8px;
  font-size: 15px; cursor: pointer; white-space: nowrap;
}
.mode[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 760px; width: fit-content; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { background: var(--me); color: var(--me-ink); align-self: flex-start; border-end-start-radius: 4px; }
.msg.bot { background: var(--panel); border: 1px solid var(--line); align-self: flex-end; border-end-end-radius: 4px; }
.msg.bot.thinking { color: var(--muted); }
.msg .err { color: var(--err); display: block; margin-top: 6px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
.src {
  font-size: 13px; border: 1px solid var(--line); background: var(--soft); color: var(--ink);
  border-radius: 999px; padding: 2px 10px; cursor: pointer;
}
.badge { font-size: 11px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 0 5px; margin-inline-start: 4px; }
.welcome { color: var(--muted); text-align: center; margin: auto; max-width: 440px; }
.welcome b { color: var(--ink); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.suggest button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 15px; }
form { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
textarea {
  flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); border-radius: 14px;
  padding: 8px 12px; max-height: 140px; min-height: 44px;
}
.send { border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 14px; padding: 0 18px; font-weight: 700; cursor: pointer; }
.send:disabled { opacity: .5; cursor: default; }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(680px, calc(100% - 32px)); max-height: 85vh; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.dlg-head h2 { font-size: 18px; margin: 0; flex: 1; }
.dlg-head button { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
.dlg-body { padding: 12px 16px 20px; white-space: pre-wrap; }
.dlg-body h3 { font-size: 17px; margin: 10px 0 0; color: var(--brand); }
.dlg-meta { color: var(--muted); font-size: 13px; padding: 8px 16px 0; }
</style>
</head>
<body>
<header>
  <span class="logo">مَدَد</span>
  <span class="tag">معلّمك دون إنترنت</span>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">…</span></span>
</header>

<div class="controls">
  <select id="grade" aria-label="الصف"></select>
  <select id="subject" aria-label="المادة"></select>
  <div class="modes" role="group" aria-label="طريقة الإجابة">
    <button type="button" class="mode" data-mode="explain" aria-pressed="true">📖 اشرح لي</button>
    <button type="button" class="mode" data-mode="hint" aria-pressed="false">💡 ساعدني بتلميح</button>
    <button type="button" class="mode" data-mode="quiz" aria-pressed="false">✏️ اختبرني</button>
  </div>
</div>

<main id="chat" aria-live="polite">
  <div class="welcome" id="welcome">
    <p><b>أهلًا بك! أنا مَدَد.</b><br>اسألني عن أي شيء في دروسك، وسأشرحه لك من الكتاب خطوة بخطوة.</p>
    <div class="suggest" id="suggest"></div>
  </div>
</main>

<form id="form">
  <textarea id="q" rows="1" placeholder="اكتب سؤالك هنا…" maxlength="1000" required></textarea>
  <button class="send" id="send" type="submit">اسأل</button>
</form>

<dialog id="lessonDlg">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button type="button" id="dlgClose" aria-label="إغلاق">×</button></div>
  <div class="dlg-meta" id="dlgMeta"></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const state = { mode: "explain", history: [], busy: false, catalog: [] };
const SUGGEST = ["يعني إيه البسط والمقام؟", "ما هي دورة الماء؟", "كيف يصنع النبات غذاءه؟", "ما هو المبتدأ؟"];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// Model output is plain text rendered with textContent — never innerHTML.
// Strip the Markdown markers small models add anyway, so they don't show as symbols.
const tidy = (s) => s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#{1,4}\s*/gm, "");

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("dot").className = "dot " + (h.ok ? "ok" : "bad");
    $("statusText").textContent = h.ok ? h.model : "النموذج غير جاهز";
    $("statusText").title = h.error || "";
  } catch {
    $("dot").className = "dot bad";
    $("statusText").textContent = "الخادم لا يستجيب";
  }
}

async function loadCatalog() {
  const { grades } = await (await fetch("/api/catalog")).json();
  state.catalog = grades;
  const g = $("grade");
  g.replaceChildren(new Option("كل الصفوف", ""), ...grades.map((x) => new Option(x.name, x.id)));
  fillSubjects();
}

function fillSubjects() {
  const gid = $("grade").value;
  const subjects = new Map();
  for (const g of state.catalog) {
    if (gid && g.id !== gid) continue;
    for (const s of g.subjects) subjects.set(s.id, s.name);
  }
  $("subject").replaceChildren(new Option("كل المواد", ""), ...[...subjects].map(([id, n]) => new Option(n, id)));
}

function scrollDown() { $("chat").scrollTop = $("chat").scrollHeight; }

function addSources(bubble, sources) {
  if (!sources.length) return;
  const box = el("div", "sources");
  const seen = new Set();
  for (const s of sources) {
    if (seen.has(s.lesson_id)) continue;
    seen.add(s.lesson_id);
    const b = el("button", "src", `📘 ${s.title}`);
    b.type = "button";
    if (!s.reviewed) b.append(el("span", "badge", "غير مراجَع"));
    b.onclick = () => openLesson(s.lesson_id);
    box.append(b);
  }
  bubble.append(box);
}

async function openLesson(id) {
  const l = await (await fetch("/api/lesson?id=" + encodeURIComponent(id))).json();
  $("dlgTitle").textContent = l.title;
  $("dlgMeta").textContent = `${l.grade} · ${l.subject}` + (l.reviewed ? ` · راجعه: ${l.reviewer || "معلم"}` : " · ⚠️ لم يراجعه معلم بعد") + (l.source ? `\nالمصدر: ${l.source}` : "");
  $("dlgBody").replaceChildren(...l.body.split("\n").map((line) => {
    const h = line.match(/^#{1,3}\s+(.*)/);
    return h ? el("h3", "", h[1]) : document.createTextNode(line.replace(/\*\*(.+?)\*\*/g, "$1") + "\n");
  }));
  $("lessonDlg").showModal();
}

async function ask(question) {
  if (state.busy || !question.trim()) return;
  state.busy = true; $("send").disabled = true;
  $("welcome")?.remove();
  $("chat").append(el("div", "msg me", question));
  const bubble = el("div", "msg bot thinking");
  const text = el("span", "", "أفكّر…");
  bubble.append(text);
  $("chat").append(bubble); scrollDown();

  let answer = "", sources = [];
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode: state.mode, grade: $("grade").value, subject: $("subject").value, history: state.history.slice(-6) }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "sources") sources = ev.sources;
        else if (ev.type === "token") {
          if (!answer) bubble.classList.remove("thinking");
          answer += ev.text; text.textContent = tidy(answer); scrollDown();
        } else if (ev.type === "error") {
          bubble.classList.remove("thinking");
          bubble.append(el("span", "err", "تعذّر الحصول على إجابة: " + ev.message));
        }
      }
    }
  } catch (e) {
    bubble.classList.remove("thinking");
    if (!answer) text.textContent = "";
    bubble.append(el("span", "err", "تعذّر الاتصال: " + e.message));
  }
  addSources(bubble, sources); scrollDown();
  if (answer) state.history.push({ role: "user", content: question }, { role: "assistant", content: answer });
  state.busy = false; $("send").disabled = false; $("q").focus();
}

document.querySelectorAll(".mode").forEach((b) => b.onclick = () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll(".mode").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
$("grade").onchange = () => { fillSubjects(); state.history = []; };
$("subject").onchange = () => { state.history = []; };
$("form").onsubmit = (e) => { e.preventDefault(); const q = $("q").value; $("q").value = ""; ask(q); };
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("q").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("dlgClose").onclick = () => $("lessonDlg").close();
for (const s of SUGGEST) { const b = el("button", "", s); b.type = "button"; b.onclick = () => ask(s); $("suggest").append(b); }

loadCatalog(); health(); setInterval(health, 15000);
</script>
</body>
</html>
